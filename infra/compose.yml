# Rascunho de referência (ADR-0004, ADR-0005, ADR-0006). Ainda não há código da aplicação.
# Uso: docker compose --env-file .env up -d
# Variáveis não secretas vêm de .env e app.env (fora do git). Segredos vêm de arquivos em ${SECRETS_DIR}.

name: ebi

x-app: &app
  image: ghcr.io/helesjunior/ccb-ebi-api:${APP_TAG:?defina APP_TAG}
  restart: unless-stopped
  env_file: app.env
  environment:
    DB_HOST: postgres
    REDIS_HOST: redis
    AWS_ENDPOINT: http://minio:9000
    AWS_USE_PATH_STYLE_ENDPOINT: "true"
    CLAMAV_HOST: clamav
    CLAMAV_PORT: "3310"
    LOG_CHANNEL: stderr
    APP_KEY_FILE: /run/secrets/app_key
    DB_PASSWORD_FILE: /run/secrets/db_password
    REDIS_PASSWORD_FILE: /run/secrets/redis_password
    AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/minio_app_secret
  secrets: [app_key, db_password, redis_password, minio_app_secret]
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]

services:
  proxy:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=ebi_edge
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --ping=true
    ports: ["80:80", "443:443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks: [edge]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]

  # Job único: roda as migrações e termina. Executado a cada deploy, antes da api.
  migrate:
    <<: *app
    restart: "no"
    command: ["php", "artisan", "migrate", "--force"]
    networks: [app, data]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ["php", "artisan", "octane:frankenphp", "--host=0.0.0.0", "--port=8000"]
    secrets: [app_key, db_password, redis_password, minio_app_secret, laudos_key]
    networks: [edge, app, data]
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${API_HOST}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.services.api.loadbalancer.server.port=8000
      - traefik.http.middlewares.api-ratelimit.ratelimit.average=50
      - traefik.http.middlewares.api-ratelimit.ratelimit.burst=100
      - traefik.http.routers.api.middlewares=api-ratelimit
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
      interval: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker:
    <<: *app
    command: ["php", "artisan", "horizon"]
    secrets: [app_key, db_password, redis_password, minio_app_secret, laudos_key]
    networks: [app, data]
    stop_grace_period: 60s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      clamav: { condition: service_healthy }

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    networks: [app, data]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    image: ghcr.io/helesjunior/ccb-ebi-web:${APP_TAG:?defina APP_TAG}
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    networks: [edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${WEB_HOST}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=le
      - traefik.http.services.web.loadbalancer.server.port=8080

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ebi
      POSTGRES_USER: ebi
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebi -d ebi"]
      interval: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets: [redis_password]
    volumes: [redisdata:/data]
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" --no-auth-warning ping | grep PONG"]
      interval: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: minio_root_user
      MINIO_ROOT_PASSWORD_FILE: minio_root_password
    secrets: [minio_root_user, minio_root_password]
    volumes: [miniodata:/data]
    networks: [data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes: [clamdb:/var/lib/clamav]
    networks: [app]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      start_period: 5m

  # Backup contínuo do PostgreSQL com WAL-G para o destino fora da VM (ADR-0006).
  # A imagem e o destino ainda serão definidos.
  # pg-backup:
  #   image: <imagem com wal-g>
  #   networks: [data]

networks:
  edge:
    name: ebi_edge
  app:
  data:
    # Sem saída para a internet. O clamav fica em "app" porque o freshclam precisa baixar assinaturas.
    internal: true

volumes:
  pgdata:
  redisdata:
  miniodata:
  clamdb:
  letsencrypt:

secrets:
  app_key:
    file: ${SECRETS_DIR:?defina SECRETS_DIR}/app_key
  db_password:
    file: ${SECRETS_DIR}/db_password
  redis_password:
    file: ${SECRETS_DIR}/redis_password
  minio_root_user:
    file: ${SECRETS_DIR}/minio_root_user
  minio_root_password:
    file: ${SECRETS_DIR}/minio_root_password
  minio_app_secret:
    file: ${SECRETS_DIR}/minio_app_secret
  laudos_key:
    file: ${SECRETS_DIR}/laudos_key
