# nginx para servir o portal buildado (SPA) em container read-only.
# Escuta 8080 (porta esperada pelo infra/compose.yml) e faz fallback de SPA.
# Diretórios voláteis (cache, pid) ficam em tmpfs, montados pelo compose.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Tudo que é volátil mora em /tmp (tmpfs no read-only).
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Assets com hash no nome: cacheável por muito tempo.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Fallback de SPA: qualquer rota não encontrada devolve o index.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}