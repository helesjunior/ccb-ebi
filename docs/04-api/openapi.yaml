# Esqueleto inicial. Cresce junto com a implementação; ver convencoes.md e endpoints.md.
openapi: 3.1.0
info:
  title: EBI API
  version: 0.1.0
  description: API da Plataforma de Gestão do Espaço Bíblico Infantil (EBI). Proposta, sujeita à validação.
servers:
  - url: https://api.example.invalid/api/v1
    description: Placeholder; o domínio será definido pela infraestrutura da CCB.
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: participants
  - name: sessions
  - name: activities
paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Autenticar
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { description: Autenticado ou MFA pendente }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /sessions/{sessionId}/attendance:
    post:
      tags: [sessions]
      summary: Registrar presença
      description: Idempotente. Aplica a regra de elegibilidade etária (RN-13 a RN-16).
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantId]
              properties:
                participantId: { type: string }
                origin: { type: string, enum: [web, app] }
      responses:
        '201':
          description: Presença registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attendance' }
        '200': { description: Presença já existente (mesma chave ou mesmo participante e sessão) }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { description: Participante inelegível pela idade, ou sessão não aberta }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
  responses:
    Problem:
      description: Erro no formato RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
    Attendance:
      type: object
      properties:
        id: { type: string }
        sessionId: { type: string }
        participantId: { type: string }
        status: { type: string, enum: [valid, reversed] }
        origin: { type: string, enum: [web, app] }
        recordedAt: { type: string, format: date-time }
