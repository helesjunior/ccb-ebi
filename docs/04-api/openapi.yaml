        hora_inicio: { type: [string, 'null'] }
        hora_fim: { type: [string, 'null'] }
        motivo: { type: string }
    AgendaExcecaoInput:
      type: object
      required: [tipo, data, motivo]
      properties:
        tipo: { type: string, enum: [feriado, cancelamento, horario_especial] }
        data: { type: string, format: date }
        agenda_ebi_id: { type: [string, 'null'] }
        hora_inicio: { type: [string, 'null'] }
        hora_fim: { type: [string, 'null'] }
        motivo: { type: string, minLength: 3, maxLength: 247 }
    MembroEquipe:
      type: object
      required: [usuario_id, nome, papeis]
      properties:
        usuario_id: { type: string }
        nome: { type: string }
