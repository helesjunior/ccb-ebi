        o adm_igreja criam para qualquer coordenadora vigente. Coordenadora sem
        vinculo vigente no EBI ou na igreja responde 422 `coordenadora_invalida`.
        Exige `equipe.gerenciar`.
      security:
        - bearerAuth: []
