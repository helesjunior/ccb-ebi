        - $ref: '#/components/parameters/XActingScope'
      responses:
        '200':
          description: Dependentes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Dependente' }
        '401': { $ref: '#/components/responses/Problem' }
  /me/participants/{id}/attendance:
    get:
      tags: [participants]
      summary: Histórico de presenças do dependente (autorização por propriedade, CA-04)
      description: >-
        Histórico de presenças de um participante representado pelo responsável
        autenticado (vínculo `aprovada` e vigente).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ParticipanteId'
      responses:
        '200':
          description: Histórico de presenças do dependente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/HistoricoPresenca' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /guardian-requests:
    get:
      tags: [participants]
      summary: Listar pedidos de vínculo (RF-03)
      description: >-
        Lista vínculos visíveis ao ator: os do seu território, para quem tem
        `vinculo.gerenciar`, e os que ele mesmo abriu, por propriedade. Exige a
        finalidade declarada, registrada na auditoria.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - name: validacao
          in: query
          required: false
          schema:
            type: string
            enum: [pendente, aprovada, aguardando_documento, recusada, todos]
            default: pendente
        - $ref: '#/components/parameters/FinalidadeLeitura'
      responses:
        '200':
          description: Pedidos visíveis ao ator
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ResponsavelParticipante' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /guardian-requests/{id}:
    patch:
      tags: [participants]
      summary: Decidir pedido de vínculo (RF-03)
      description: >-
        A coordenadora aprova, recusa, pede documento, revoga ou contesta um
        vínculo. Exige `vinculo.gerenciar`
        sobre o território do participante; fora dele responde 404 (ser
        responsável pela criança não basta). Dentro do território autorizado, o
        autor do pedido não pode decidir o próprio vínculo: nesse caso responde
        403 `acesso_negado`, e a decisão deve ficar com outro operador do mesmo
        território. O gate territorial precede a recusa de autoria: o autor fora
        do território recebe 404, como qualquer outro.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/VinculoResponsavelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisaoVinculoInput' }
      responses:
        '200':
          description: Vínculo atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponsavelParticipante' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /participants/{id}/age-exceptions:
    post:
      tags: [participants]
      summary: Solicitar exceção inclusiva (FL-06)
      description: >-
        O responsável solicita a exceção inclusiva para um participante. Nasce
        `solicitada`. Escrita idempotente.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/ParticipanteId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExcecaoEtariaInput' }
      responses:
        '201':
          description: Exceção solicitada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExcecaoEtaria' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /age-exceptions/{id}:
    patch:
      tags: [participants]
      summary: Decidir exceção inclusiva (FL-06, CA-17)
      description: >-
        A coordenadora aprova, recusa, suspende ou revoga a exceção. Exige a
        operação `excecao.decidir` e o participante ligado ao escopo (igreja
        de referência ou, sem igreja, presença válida num EBI do escopo).
        Fora do território responde 404, como se a exceção não existisse.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/ExcecaoEtariaId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisaoExcecaoInput' }
      responses:
        '200':
          description: Exceção atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExcecaoEtaria' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /participants/{id}/merge:
    post:
      tags: [participants]
      summary: Mesclar duplicados (CA-27)
      description: >-
        Funde o duplicado no principal, preservando um snapshot para desfazer.
        Exige `participante.mesclar`; escrita idempotente e auditada.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/ParticipanteId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MesclagemInput' }
      responses:
        '200':
          description: Participante principal após a mesclagem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Participante' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /participants/{id}/merge/undo:
    post:
      tags: [participants]
      summary: Desfazer mesclagem (CA-27)
      description: >-
        Restaura o estado anterior gravado na última mesclagem. Exige
        `participante.mesclar`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/ParticipanteId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Participante principal restaurado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Participante' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /arquivos/{id}:
    get:
      tags: [participants]
      summary: URL assinada de download da evidência/arquivo
      description: >-
        Devolve uma URL assinada de curta duração (5 min) para o arquivo já
        liberado pelo pipeline (`status_antivirus = limpo`). O arquivo nunca é
        servido diretamente; exige a operação `evidencia.ler` (territorial).
        Arquivo em quarentena, infectado ou inválido não é servido (409).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/ArquivoId'
      responses:
        '200':
          description: URL assinada e sua expiração
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UrlArquivo' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /reports/attendance:
    get:
      tags: [reports]
      summary: Relatório agregado de presença (RF-14)
      description: >-
        Totais de presença do nó pedido e dos filhos diretos, sem nomes de
        pessoas (ADR-0029). O nó é `nivel` + `id`; sem eles, usa o nó do
        contexto de atuação. A supressão segue o ADR-0020: valores de 1 a 4 são
        escondidos para quem atua acima da igreja, e um filho suprimido suprime
        os indicadores de pessoas e a média do pai (`filho_suprimido`). Zero
        aparece. Ficam isentos só papéis locais (coordenadora, administração da
        igreja, ministério local) em escopo de igreja ou EBI; papel
        administrativo em escopo de igreja continua suprimido. M-02 e M-03
        contam pelas presenças nas igrejas da unidade; M-01, participantes
        ativos e M-09 contam pela igreja de referência, com janela até a data de
        geração; a presença que torna alguém ativo vale em qualquer igreja. O nó do EBI mede por `ebiIds` e marca M-01, ativos e M-09 como
        `nao_se_aplica`. Contagens de sessões (M-05) e de igrejas com EBI ativo
        (M-09) nunca são suprimidas nem entram na cascata. O fuso é o único da
        unidade ou, se variar, `fuso de cada igreja`. Exige `relatorio.ler`; nó
        inexistente ou fora do território responde 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - name: nivel
          in: query
          required: false
          description: Tipo do nó pedido. Sem ele, usa o contexto de atuação.
          schema: { type: string, enum: [central, regional, setor, igreja, ebi] }
        - name: id
          in: query
          required: false
          description: ID do nó pedido. Obrigatório junto de `nivel`.
          schema: { type: string, maxLength: 64 }
        - name: inicio
          in: query
          required: true
          description: Primeiro dia do período (fuso da igreja do nó).
          schema: { type: string, format: date }
        - name: fim
          in: query
          required: true
          description: Último dia do período, no máximo 366 dias após `inicio`.
          schema: { type: string, format: date }
        - name: formato
          in: query
          required: false
          description: >-
            `json` (padrão) devolve o relatório em JSON; `csv` devolve o mesmo
            cálculo em arquivo, com uma linha para o nó e uma por filho.
          schema: { type: string, enum: [json, csv], default: json }
      responses:
        '200':
          description: >-
            Relatório do nó e dos filhos diretos. O CSV sai quando `formato=csv`;
            o JSON nos demais casos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelatorioPresenca' }
            text/csv:
              schema: { type: string }
              example: |
                nivel,id,nome,participantes_distintos,presencas,sessoes_realizadas,media_por_sessao,participantes_cadastrados,participantes_ativos,igrejas_com_ebi_ativo,sessoes_previstas,sessoes_com_equipe_minima,cobertura_escala,periodo_inicio,periodo_fim,fuso,gerado_em,criterios
                igreja,01H...,Igreja,42,120,8,15.0,60,58,1,8,6,75.0,2026-10-20,2026-11-19,America/Sao_Paulo,2026-11-19T12:00:00+00:00,"Participantes sem igreja de referencia..."
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
    XActingScope:
      name: X-Acting-Scope
      in: header
      required: false
      description: >-
        Contexto de atuação no formato `papel=<codigo>;escopo=<tipo>:<id>`
        (RN-11). Obrigatório quando o usuário acumula vínculos; o servidor
        revalida contra os vínculos vigentes (nunca é aceito sem revalidação).
      schema: { type: string, example: "papel=adm_setor;escopo=setor:01H..." }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IgrejaId:
      name: id
      in: path
      required: true
      schema: { type: string }
    RegionalId:
      name: id
      in: path
      required: true
      schema: { type: string }
    SetorId:
      name: id
      in: path
      required: true
      schema: { type: string }
    EbiId:
      name: id
      in: path
      required: true
      schema: { type: string }
    SessaoId:
      name: id
      in: path
      required: true
      schema: { type: string }
    PresencaId:
      name: id
      in: path
      required: true
      schema: { type: string }
    AgendaId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ExcecaoAgendaId:
      name: id
      in: path
      required: true
      schema: { type: string }
    UsuarioId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ConviteId:
      name: id
      in: path
      required: true
      schema: { type: string }
    VinculoId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ConsentimentoId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ParticipanteId:
      name: id
      in: path
      required: true
      schema: { type: string }
    VinculoResponsavelId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ExcecaoEtariaId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ArquivoId:
      name: id
      in: path
      required: true
      schema: { type: string }
    TrocaId:
      name: id
      in: path
      required: true
      schema: { type: string }
    FinalidadeLeitura:
      name: finalidade
      in: query
      required: true
      description: >-
        Finalidade declarada da leitura identificável (matriz `*` da leitura),
        registrada na auditoria. Não reusa a finalidade do termo de consentimento.
      schema: { type: string, maxLength: 255 }
  responses:
    Problem:
      description: Erro no formato RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
    UrlArquivo:
      type: object
      required: [url, expira_em]
      properties:
        url:
          type: string
          description: URL assinada de curta duração (bucket cifrado).
        expira_em:
          type: string
          format: date-time
          description: Instante de expiração da URL.
    RelatorioIndicador:
      type: object
      required: [valor, suprimido, motivo]
      properties:
        valor:
          type: number
          nullable: true
          description: >-
            Número do indicador. `null` quando suprimido ou quando o indicador
            não existe no nível (`nao_se_aplica`).
        suprimido: { type: boolean }
        motivo:
          type: string
          nullable: true
          enum: [limiar, filho_suprimido, nao_se_aplica]
          description: >-
            `limiar`: valor de 1 a 4 escondido para quem atua acima da igreja;
            `filho_suprimido`: um nó abaixo tem valor suprimido;
            `nao_se_aplica`: o indicador não existe neste nível (ex.: M-01 no
            EBI).
    RelatorioPresenca:
      type: object
      required: [no, periodo, fuso, gerado_em, criterios, totais, filhos]
      properties:
        no:
          type: object
          required: [nivel, id, nome]
          properties:
            nivel: { type: string, enum: [central, regional, setor, igreja, ebi] }
            id: { type: string }
            nome: { type: string }
        periodo:
          type: object
          required: [inicio, fim]
          properties:
            inicio: { type: string, format: date }
            fim: { type: string, format: date }
        fuso:
          type: string
          description: >-
            Fuso usado para decidir a data de cada sessão: o único das igrejas
            da unidade, ou `fuso de cada igreja` quando ela abrange mais de um.
        gerado_em: { type: string, format: date-time }
        criterios:
          type: string
          description: Explicação em texto das regras de cálculo e supressão.
        totais:
          $ref: '#/components/schemas/TotaisRelatorio'
        filhos:
          type: array
          description: Totais de cada filho direto do nó.
          items:
            type: object
            required: [nivel, id, nome, totais]
            properties:
              nivel: { type: string, enum: [central, regional, setor, igreja, ebi] }
              id: { type: string }
              nome: { type: string }
              totais:
                $ref: '#/components/schemas/TotaisRelatorio'
    TotaisRelatorio:
      type: object
      required:
        - participantes_distintos
        - presencas
        - sessoes_realizadas
        - media_por_sessao
        - participantes_cadastrados
        - participantes_ativos
        - igrejas_com_ebi_ativo
        - sessoes_previstas
        - sessoes_com_equipe_minima
        - cobertura_escala
      properties:
        participantes_distintos: { $ref: '#/components/schemas/RelatorioIndicador' }
        presencas: { $ref: '#/components/schemas/RelatorioIndicador' }
        sessoes_realizadas: { $ref: '#/components/schemas/RelatorioIndicador' }
        media_por_sessao: { $ref: '#/components/schemas/RelatorioIndicador' }
        participantes_cadastrados: { $ref: '#/components/schemas/RelatorioIndicador' }
        participantes_ativos: { $ref: '#/components/schemas/RelatorioIndicador' }
        igrejas_com_ebi_ativo: { $ref: '#/components/schemas/RelatorioIndicador' }
        # M-06 (E07): sessoes ja ocorridas no periodo, as que tem escala
        # aprovada com a equipe minima confirmada e vigente, e o percentual.
        # Nao passam pela supressao por limiar (contam sessoes, nao pessoas).
        sessoes_previstas: { $ref: '#/components/schemas/RelatorioIndicador' }
        sessoes_com_equipe_minima: { $ref: '#/components/schemas/RelatorioIndicador' }
        cobertura_escala: { $ref: '#/components/schemas/RelatorioIndicador' }
    Usuario:
      type: object
      properties:
        id: { type: string }
        nome: { type: string }
        email: { type: string, format: email }
        email_verificado: { type: boolean }
        status: { type: string, enum: [ativo, suspenso] }
        papeis:
          type: array
          items: { type: string }
        mfa_ativo:
          type: boolean
          description: Indica se o usuario tem fator TOTP confirmado.
    LoginResponse:
      type: object
      properties:
        mfa_required: { type: boolean }
        mfa_inscricao_pendente: { type: boolean }
        token: { type: [string, 'null'] }
        token_desafio: { type: [string, 'null'] }
        usuario: { $ref: '#/components/schemas/Usuario' }
    SessaoEmitida:
      type: object
      properties:
        token: { type: string }
        usuario: { $ref: '#/components/schemas/Usuario' }
    ContextoAtuacao:
      type: object
      properties:
        papel: { type: string }
        tipo_escopo: { type: string, enum: [central, regional, setor, igreja, ebi] }
        escopo_id: { type: string }
    SessaoLogin:
      type: object
      properties:
        id: { type: string }
        dispositivo: { type: string }
        criada_em: { type: string, format: date-time }
        expira_em: { type: string, format: date-time }
    InscricaoTotp:
      type: object
      properties:
        segredo: { type: string }
        uri: { type: string }
    RegistroGuardiao:
      type: object
      required: [nome, email, password, termo_versao_id, aceite]
      properties:
        nome: { type: string, maxLength: 255 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 12 }
        termo_versao_id: { type: string, description: 'Versão vigente do termo de cadastro aceita (CA-16).' }
        aceite: { type: boolean, description: 'Confirmação explícita do aceite do termo (CA-16).' }
    Convite:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        papel: { type: string }
        tipo_escopo: { type: string, enum: [central, regional, setor, igreja, ebi] }
        escopo_id: { type: string }
        expira_em: { type: string, format: date-time }
        pendente: { type: boolean }
    ConviteInput:
      type: object
      required: [email, papel, tipo_escopo, escopo_id]
      properties:
        email: { type: string, format: email }
        papel: { type: string }
        tipo_escopo: { type: string, enum: [central, regional, setor, igreja, ebi] }
        escopo_id: { type: string }
    ContaCriada:
      type: object
      properties:
        id: { type: string }
        email_normalizado: { type: string, format: email }
        nome: { type: string }
    Vinculo:
      type: object
      properties:
        id: { type: string }
        usuario_id: { type: string }
        tipo_escopo: { type: string, enum: [central, regional, setor, igreja, ebi] }
        escopo_id: { type: string }
    VinculoInput:
      type: object
      required: [usuario_id, papel, tipo_escopo, escopo_id]
      properties:
        usuario_id: { type: string }
        papel: { type: string }
        tipo_escopo: { type: string, enum: [central, regional, setor, igreja, ebi] }
        escopo_id: { type: string }
    UsuarioPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Usuario' }
        meta:
          type: object
          properties:
            proximo_cursor: { type: [string, 'null'] }
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          properties:
            database: { type: string, enum: [ok, fail] }
            redis: { type: string, enum: [ok, fail] }
    Church:
      type: object
      properties:
        id: { type: string }
        codigo: { type: string }
        nome: { type: string }
        endereco: { type: [string, 'null'] }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        timezone: { type: string }
        status: { type: string, enum: [ativo, inativo] }
        setor:
          oneOf:
            - $ref: '#/components/schemas/Sector'
            - type: 'null'
    ChurchInput:
      type: object
      required: [codigo, nome]
      properties:
        codigo: { type: string }
        nome: { type: string }
        endereco: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        timezone: { type: string }
        status: { type: string, enum: [ativo, inativo] }
    ChurchPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Church' }
        meta:
          type: object
          properties:
            proximo_cursor: { type: [string, 'null'] }
    Region:
      type: object
      properties:
        id: { type: string }
        codigo: { type: string }
