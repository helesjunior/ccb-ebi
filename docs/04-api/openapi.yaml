          schema: { type: string, example: cadastro }
      responses:
        '200':
          description: Termo vigente da finalidade (lista vazia quando não houver)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TermoVersao' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /privacy/consents:
    get:
      tags: [privacy]
      summary: Manifestações de consentimento atuais do titular
      description: >-
        Lista, por finalidade, a manifestação mais recente do próprio usuário
        autenticado. Não expõe consentimentos de terceiros.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Manifestações atuais do titular
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ManifestacaoPrivacidade' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [privacy]
      summary: Registrar aceite ou recusa do próprio titular
      description: >-
        Registra uma manifestação do usuário autenticado com evidência (IP,
        user agent e hash do termo). O cadastro assistido (`participante_id`)
        ainda não é aceito nesta etapa.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentimentoInput' }
      responses:
        '201':
          description: Manifestação registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManifestacaoPrivacidade' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /privacy/consents/{id}:
    get:
      tags: [privacy]
      summary: Recuperar uma manifestação com a versão do termo (CA-16)
      description: >-
        Exige a operação `consentimento.ler` e respeita o escopo de atuação:
        operadores só enxergam manifestações de titulares na própria subárvore.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConsentimentoId'
      responses:
        '200':
          description: Manifestação com a versão e o hash do termo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManifestacaoPrivacidade' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /privacy/requests:
    post:
      tags: [privacy]
      summary: Abrir solicitação de direito do titular (RF-16)
      description: >-
        O titular autenticado abre uma solicitação de exercício de direitos
        (acesso, correção ou revogação). A resposta traz o protocolo gerado e o
        status inicial `recebida`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitacaoInput' }
      responses:
        '201':
          description: Solicitação aberta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitacaoTitular' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /audit-events:
    get:
      tags: [audit]
      summary: Consultar eventos de auditoria (RF-16)
      description: >-
        Lista a trilha append-only, paginada por cursor e ordenada por `id`
        crescente. Exige a operação `auditoria.ler`. `super_admin` enxerga todos
        os eventos; os demais papéis só enxergam eventos cujo `escopo`
        territorial (`tipo:id`) esteja na própria subárvore. Eventos sem escopo
        territorial não aparecem para papéis territoriais.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: recurso
          in: query
          required: false
          schema: { type: string }
        - name: ator_id
          in: query
          required: false
          schema: { type: string }
        - name: de
          in: query
          required: false
          description: Início do intervalo de ocorrência (inclusive).
          schema: { type: string, format: date-time }
        - name: ate
          in: query
          required: false
          description: Fim do intervalo de ocorrência (inclusive).
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Página de eventos de auditoria
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventoAuditoriaPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /participants:
    get:
      tags: [participants]
      summary: Buscar participantes por nome/data (dedup, CA-27)
      description: >-
        Busca candidatos por nome normalizado (sem acento, minúsculas) e, se
        informado, data de nascimento. Exige a operação `participante.ler` e a
        finalidade declarada (`finalidade`), registrada na auditoria. Para quem
        atua acima da igreja, o resultado é cortado por igreja de referência:
        grupos com 1 a 4 participantes ativos, ou sem nenhum ativo, saem da
        resposta inteiros (ADR-0020, decisão 11). Só papéis locais
        (coordenadora, administração da igreja, ministério local) e o auxiliar,
        em escopo de igreja ou EBI, veem a lista completa; os demais recebem o
        corte mesmo com contexto de igreja.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: data_nascimento
          in: query
          required: false
          schema: { type: string, format: date }
        - name: igreja_referencia_id
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/FinalidadeLeitura'
      responses:
        '200':
          description: Candidatos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Participante' }
                  suprimido:
                    type: boolean
                    description: >-
                      Presente e `true` quando algum grupo de 1 a 4 candidatos
                      já autorizados foi retirado da resposta (ADR-0020);
                      ausente quando nada foi escondido. O corte roda depois da
                      autorização, para não sinalizar cadastros fora do
                      território do ator.
                  motivo:
                    type: string
                    enum: [limiar]
                    description: Presente junto de `suprimido`.
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      tags: [participants]
      summary: Cadastrar participante (RF-02)
      description: >-
        O responsável cadastra um participante. Gera a matrícula nacional e
        registra auditoria. Exige a operação `participante.cadastrar`; escrita
        idempotente (`Idempotency-Key`). `igreja_referencia_id`, quando
        informada, precisa existir (senão 422). O responsável escolhe qualquer
        igreja; os demais papéis só uma do próprio escopo (senão 422
        `igreja_fora_do_escopo`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParticipanteInput' }
      responses:
        '201':
          description: Participante cadastrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Participante' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /participants/assisted:
    post:
      tags: [participants]
      summary: Cadastro assistido com evidência (FL-01, CA-16)
      description: >-
        A coordenadora cadastra um participante presencialmente com a evidência
        de aceite obrigatória (arquivo, que passa pelo pipeline de storage). O
        responsável pode existir sem conta. Exige `participante.cadastrar`. `igreja_referencia_id`,
        quando informada, precisa existir e estar no escopo de quem cadastra
        (senão 422; fora do escopo, `igreja_fora_do_escopo`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/CadastroAssistidoInput' }
      responses:
        '201':
          description: Participante cadastrado (assistido)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Participante' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /participants/{id}:
    get:
      tags: [participants]
      summary: Consultar participante (RF-02)
      description: >-
        Leitura por operador, sob a operação `participante.ler` (territorial). O
        caminho do responsável é por propriedade (`/me/participants`). Exige a
        finalidade declarada, registrada na auditoria.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/ParticipanteId'
        - $ref: '#/components/parameters/FinalidadeLeitura'
      responses:
        '200':
          description: Participante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Participante' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [participants]
      summary: Corrigir cadastro do participante (CA-27)
      description: >-
        Exige `participante.corrigir` e participante ligado ao escopo do ator
        (igreja de referência no escopo; sem igreja, presença válida em EBI do
        escopo). Motivo obrigatório, auditado em `participante.corrigido`.
        `422 nada_a_corrigir` quando nenhum campo muda; `422 igreja_fora_do_escopo`
        quando a nova igreja não está no escopo; `409 participante_mesclado`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/ParticipanteId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrecaoParticipanteInput' }
      responses:
        '200':
          description: Participante corrigido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Participante' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /participants/{id}/attendance:
    get:
      tags: [participants]
      summary: Histórico de presenças (operador)
      description: >-
        Histórico de presenças do participante, do mais recente ao mais antigo.
