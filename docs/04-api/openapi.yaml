        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /ebis/{id}/schedules:
    get:
      tags: [escalas]
      summary: Sessoes do EBI com a situacao da escala
      description: >-
        Sessoes do periodo, cada uma com a escala (quando houver) e a situacao:
        `sem_escala`, `cancelada`, `abaixo_do_minimo`, `aguardando_aprovacao` ou
        `aprovada`. Exige `escala.ler`; EBI fora do alcance responde 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/EbiId'
        - name: inicio
          in: query
          required: true
          description: Inicio do periodo (inclusive).
          schema: { type: string, format: date }
        - name: fim
          in: query
          required: true
          description: Fim do periodo (inclusive).
          schema: { type: string, format: date }
      responses:
        '200':
          description: Sessoes do periodo com a situacao da escala
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EscalaResumo' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /sessions/{id}/schedules:
    post:
      tags: [escalas]
      summary: Criar a escala de uma sessao
      description: >-
        A sessao precisa estar `prevista` ou `aberta` (409
        `sessao_em_estado_invalido`). Uma escala por sessao: a segunda responde
        409 `escala_existente`. O divisor de auxiliares e copiado do EBI no
        momento da criacao. Membro fora da equipe, sem vinculo vigente na data
        ou com papel incompativel responde 422 `membro_inelegivel`; a mesma
        pessoa duas vezes, 422 `membro_ja_escalado`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/SessaoId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EscalaCriacaoInput' }
      responses:
        '201':
          description: Escala criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EscalaEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /schedules/{id}:
    get:
      tags: [escalas]
      summary: Detalhe da escala
      description: >-
        Sessao, equipe minima calculada e membros com nome, vigencia e
        conflitos. Exige `escala.ler`; escala inexistente ou fora do alcance
        responde 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/SessaoId'
      responses:
        '200':
          description: Escala
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EscalaEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [escalas]
      summary: Alterar a estimativa da escala
      description: >-
        Toda alteracao desfaz a aprovacao: a escala volta a `prevista`,
        `aprovado_por`/`aprovado_em` sao limpos, o divisor atual do EBI e
        copiado, a confirmacao e mantida e as trocas pendentes sao canceladas
        (`escala.troca_cancelada`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/SessaoId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EscalaEstimativaInput' }
      responses:
        '200':
          description: Escala alterada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EscalaEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /schedules/{id}/approve:
    post:
      tags: [escalas]
      summary: Aprovar a escala
      description: >-
        Exige `escala.aprovar`. Quem aprova de fato e a coordenadora chefe
        vigente do EBI; sem chefe vigente, o `adm_igreja` da igreja. Outro
        papel responde 403 `aprovador_invalido`. Guardas, nesta ordem: escala
        ja `aprovada` (409 `escala_em_estado_invalido`), sessao cancelada ou
        encerrada (409 `sessao_em_estado_invalido`), membro sem vinculo
        vigente na data (422 `membro_sem_vinculo`) e equipe minima nao
        atingida (422 `equipe_minima_nao_atingida`). Nenhuma recusa altera a
        escala. Sucesso grava `aprovado_por`/`aprovado_em` e registra
        `escala.aprovada`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/SessaoId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Escala aprovada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EscalaEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /schedules/{id}/team-attendance:
    put:
      tags: [escalas]
      summary: Presença da equipe (planejado × cumprido)
      description: >-
        Exige `escala.gerenciar` e território. Só com a sessão `encerrada`
        (409 `sessao_em_estado_invalido`). O envio pode ser parcial: grava só
        as vagas informadas, e só o que muda, com quem e quando registrou.
        Id de outra escala ou de vaga `substituido` inteiro o lote sem gravar
        nada (422 `membro_invalido`). Reenviar o mesmo corpo não gera evento;
        uma correção registra `escala.presenca_equipe` com `antes`/`depois`
        por `membro_id` (sem nomes). Responde com o detalhe da escala.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/SessaoId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresencaEquipeInput' }
      responses:
        '200':
          description: Presença registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EscalaEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /schedules/{id}/members:
    post:
      tags: [escalas]
      summary: Incluir membro na escala
      description: >-
        Quem foi substituido pode ser reincluido (linha nova). Quem ja ocupa
        vaga responde 422 `membro_ja_escalado`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/SessaoId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EscalaMembroInput' }
      responses:
        '200':
          description: Escala com o novo membro
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EscalaEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /schedule-members/{id}:
    patch:
      tags: [escalas]
      summary: Mudar a funcao de um membro
      description: >-
        A funcao nova precisa ser permitida pelo papel vigente (422
        `membro_inelegivel`); membro ja substituido responde 409
        `membro_em_estado_invalido`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/SessaoId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EscalaFuncaoInput' }
      responses:
        '200':
          description: Escala atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EscalaEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [escalas]
      summary: Retirar membro da escala
      description: >-
        O membro sai da escala e a escala volta a `prevista`. Membro ja
        substituido responde 409 `membro_em_estado_invalido`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/SessaoId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Escala sem o membro
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EscalaEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /schedule-members/{id}/confirm:
    post:
      tags: [escalas]
      summary: Confirmar a própria vaga na escala
      description: >-
        Nao exige `escala.gerenciar`: a vaga tem de ser da propria pessoa
        (vaga de outra ou inexistente responde 404). Guardas, nesta ordem:
        escala fora de `aprovada` (409 `escala_em_estado_invalido`), sessao
        cancelada ou encerrada (409 `sessao_em_estado_invalido`), vinculo nao
        vigente na data (422 `membro_sem_vinculo`) e membro em
        `troca_solicitada` ou `substituido` (409 `membro_em_estado_invalido`).
        `escalado` passa a `confirmado` com `confirmado_em` e registra
        `escala.membro_confirmado`; quem ja confirmou recebe 200 sem novo
        evento.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/SessaoId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Vaga confirmada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EscalaConfirmacao' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /me/schedules:
    get:
      tags: [escalas]
      summary: Minhas escalas
      description: >-
        Vagas da propria pessoa no periodo (datas ISO, no maximo 92 dias),
        ordenadas por `inicio_previsto`. Nao exige `escala.ler`: o recorte e
        sempre o do usuario autenticado. Os conflitos (CA-12) sao da propria
        pessoa, entao vem sempre com os nomes.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - name: inicio
          in: query
          required: true
          description: Início do intervalo (inclusive).
          schema: { type: string, format: date }
        - name: fim
          in: query
          required: true
          description: Fim do intervalo (inclusive).
          schema: { type: string, format: date }
      responses:
        '200':
          description: Vagas da pessoa no periodo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MinhaEscala' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /schedule-swaps:
    get:
      tags: [escalas]
      summary: Trocas de vaga do EBI
      description: >-
        Exige `troca.decidir` no escopo `ebi:<ebi_id>`. Lista as trocas das
        vagas do EBI, opcionalmente filtradas por `status`. `situacao` e
        `expirada` quando o pedido continua `pendente` e a sessao deixou de
        estar `prevista`; a troca ja decidida nunca expira.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - name: ebi_id
          in: query
          required: true
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pendente, aprovada, recusada, cancelada] }
      responses:
        '200':
          description: Trocas do EBI
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TrocaEscala' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      tags: [escalas]
      summary: Pedir troca de vaga
      description: >-
        So o proprio membro pede pela vaga dele; vaga de outra pessoa ou
        inexistente responde 404 sem revelar. Guardas, nesta ordem: escala
        `aprovada` (409 `escala_em_estado_invalido`), sessao `prevista` (409
        `sessao_em_estado_invalido`), vaga `escalado`/`confirmado` sem troca
        pendente (409 `membro_em_estado_invalido`). Sucesso grava a solicitacao
        `pendente`, marca a vaga `troca_solicitada` e registra
        `escala.troca_solicitada`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [escala_membro_id]
              properties:
                escala_membro_id: { type: string }
                motivo: { type: string, maxLength: 500, nullable: true }
      responses:
        '201':
          description: Pedido registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrocaEscalaEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /schedule-swaps/{id}/cancel:
    post:
      tags: [escalas]
      summary: Cancelar o proprio pedido de troca
      description: >-
        So o solicitante cancela; outro usuario recebe 404. Pedido ja decidido
        responde 409 `troca_ja_decidida`. Sucesso devolve a vaga ao estado
        anterior (`escalado` ou `confirmado`) e registra
        `escala.troca_cancelada`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/TrocaId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Troca cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrocaEscalaEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /schedule-swaps/{id}:
    patch:
      tags: [escalas]
      summary: Decidir a troca
      description: >-
        Exige `troca.decidir` no EBI da escala; troca fora do alcance responde
        404. Guardas, nesta ordem: o solicitante nunca decide o proprio pedido
        (403 `sem_permissao`), quem decide de fato e a coordenadora chefe
        vigente ou, quando o pedido e da chefe ou nao ha chefe vigente, o
        `adm_igreja` da igreja (403 `aprovador_invalido`), troca ja decidida
        (409 `troca_ja_decidida`), escala `aprovada` e sessao `prevista` (409).
        Aprovar exige substituto da equipe, vigente na data e fora da escala
        (422 `membro_inelegivel`, 422 `membro_ja_escalado`): o original fica
        `substituido` e nasce o novo membro na mesma funcao, sem derrubar a
        aprovacao. Recusar devolve a vaga ao estado anterior. Registra
        `escala.troca_decidida`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/TrocaId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisao]
              properties:
                decisao: { type: string, enum: [aprovar, recusar] }
                substituto_usuario_id:
                  type: string
                  nullable: true
                  description: Obrigatorio junto de `aprovar`.
                motivo: { type: string, maxLength: 500, nullable: true }
      responses:
        '200':
          description: Troca decidida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrocaEscalaEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /schedule-vacancies:
    get:
      tags: [escalas]
      summary: Vagas de escala do EBI
      description: >-
        Exige `escala.ler` no escopo `ebi:<ebi_id>`. Lista as vagas das
        escalas do EBI, opcionalmente filtradas por `status` e pela janela
        `inicio`/`fim` (dias locais, maximo de 92 dias). Cada cartao segue a
        projecao de leitura: contagem de ofertas e quem foi escolhido, nunca os
        nomes de quem se ofereceu.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - name: ebi_id
          in: query
          required: true
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [aberta, preenchida, cancelada] }
        - name: inicio
          in: query
          required: false
          schema: { type: string, format: date }
        - name: fim
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: Vagas do EBI
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VagaEscala' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /me/schedule-vacancies:
    get:
      tags: [escalas]
      summary: Vagas abertas para a propria pessoa
      description: >-
        Nao exige papel: o recorte e sempre o do usuario autenticado. Lista as
        vagas abertas de sessoes `prevista`/`aberta` nos EBIs/igrejas em que a
        pessoa tem papel de equipe vigente, excluindo as escalas em que ela ja
        esta. Cartao publico: so a propria oferta e os proprios conflitos.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - name: inicio
          in: query
          required: true
          schema: { type: string, format: date }
        - name: fim
          in: query
          required: true
          description: No maximo 92 dias depois de `inicio`.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Vagas abertas para a pessoa
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VagaEscala' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /schedule-vacancies/{id}:
    get:
      tags: [escalas]
      summary: Cartao da vaga
      description: >-
        Sem `escala.ler` no EBI responde so com a propria oferta e os proprios
        conflitos; com `escala.ler` acrescenta `ofertas_pendentes` e
        `motivo_encerramento`; quem gere a escala (dona ou supervisao)
        acrescenta `escolhido_nome` e os nomes das ofertas pendentes.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Cartao da vaga
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VagaEscalaEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /schedules/{id}/vacancies:
    post:
      tags: [escalas]
      summary: Abrir vaga de acrescimo ou de substituicao
      description: >-
        Exige `escala.gerenciar` no EBI; so a dona e a supervisao abrem. Sem
        `substitui_membro_id` e vaga de acrescimo; com ele, o membro precisa
        ser auxiliar ativo da escala (422 `membro_invalido`), sem vaga aberta
        (409 `vaga_existente`). Sessao precisa estar `prevista` ou `aberta`
        (409 `sessao_em_estado_invalido`) e a dona precisa ter vinculo de
        coordenadora vigente (409 `dona_sem_vinculo`). Registra
        `escala.vaga_aberta`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - name: id
          in: path
          required: true
          description: Id da escala.
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                substitui_membro_id: { type: string, nullable: true }
                observacao: { type: string, maxLength: 500, nullable: true }
      responses:
        '201':
          description: Vaga aberta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VagaEscalaEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /schedule-vacancies/{id}/cancel:
    post:
      tags: [escalas]
      summary: Cancelar a vaga
      description: >-
        Exige `escala.gerenciar` no EBI. Vaga ja preenchida ou cancelada
        responde 409 `vaga_indisponivel`. Registra `escala.vaga_cancelada`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Vaga cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VagaEscalaEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /schedule-vacancies/{id}/offers:
    post:
      tags: [escalas]
      summary: Oferecer-se para a vaga
      description: >-
        Nao exige `escala.ler`: e a propria pessoa que se oferece. Precisa de
        papel de equipe vigente hoje no EBI/igreja da sessao (senao 404), estar
        fora da escala (422 `membro_ja_escalado`), ser elegivel na data da
        sessao (422 `membro_inelegivel`) e nao ter oferta pendente (409
        `oferta_existente`). A resposta e o cartao publico, com `minha_oferta`.
        Registra `escala.vaga_oferta`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Oferta registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VagaEscalaEnvelope' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /schedule-vacancy-offers/{id}:
    delete:
      tags: [escalas]
      summary: Retirar a propria oferta
      description: >-
        So o dono da oferta a retira; oferta alheia responde 404 e oferta ja
        decidida 409 `oferta_ja_decidida`. Registra `escala.vaga_oferta_retirada`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Oferta retirada
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /schedule-vacancies/{id}/choose:
    post:
      tags: [escalas]
      summary: Dona escolhe quem preenche a vaga
      description: >-
        Exige `escala.gerenciar` e so a dona decide (403
        `nao_e_dona_da_escala` para chefe ou `adm_igreja`, que apenas
        supervisionam). A pessoa escolhida entra `confirmado`, sem nova
        confirmacao; as demais ofertas ficam `descartada` e a vaga
        `preenchida`. Na substituicao o original fica `substituido`. A oferta
        ainda precisa ter a pessoa elegivel na data (422 `membro_inelegivel`).
        Registra `escala.vaga_preenchida`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oferta_id]
              properties:
                oferta_id: { type: string }
      responses:
        '200':
          description: Vaga preenchida
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/VagaEscalaEnvelope'
                  - type: object
                    properties:
                      membro_id: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /ebis/{id}/sessions:
    get:
      tags: [sessions]
      summary: Sessões do EBI no período
      description: >-
        Exige `de` e `ate` (datas ISO); intervalo máximo de 92 dias. Resultado
        ordenado por `inicio_previsto`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/EbiId'
        - name: de
          in: query
          required: true
          description: Início do intervalo (inclusive).
          schema: { type: string, format: date }
        - name: ate
          in: query
          required: true
          description: Fim do intervalo (inclusive), no máximo 92 dias após `de`.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Sessões do EBI no período, ordenadas por `inicio_previsto`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Sessao' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /ebis/{id}/sessions/generate:
    post:
      tags: [sessions]
      summary: Gerar sessões previstas
      description: >-
        Gera as sessões previstas a partir das faixas da agenda, aplicando as
        exceções do período. Aceita `de?`, `ate?` e `semanas?` (padrão 4
        semanas, máximo 12). Idempotente: sessões previstas já existentes para
        a mesma janela não são duplicadas.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/EbiId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                de: { type: string, format: date }
                ate: { type: string, format: date }
                semanas: { type: integer, minimum: 1, maximum: 12, default: 4 }
      responses:
        '201':
          description: Sessões previstas geradas (contagem de criadas e ignoradas)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeracaoSessoes' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /sessions/{id}:
    get:
      tags: [sessions]
      summary: Detalhe da sessão
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/SessaoId'
      responses:
        '200':
          description: Sessão com o resumo de equipe mínima
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoDetalhe' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [sessions]
      summary: Correção da sessão
      description: >-
        Corrige dados da sessão (`tema`, `passagem_biblica`, `inicio_real`,
        `fim_real`, `realizada`, `auxiliares_escalados`). `motivo` é
        obrigatório quando a sessão está `encerrada`. Com escala aprovada,
        `auxiliares_escalados` responde 422 `escala_aprovada_define_equipe`:
        quem conta são os auxiliares da escala.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/SessaoId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
