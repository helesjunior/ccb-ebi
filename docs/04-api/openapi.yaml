  /sessions/{id}/participants:
    get:
      tags: [sessions]
      summary: Buscar participantes elegíveis na sessão (finalidade obrigatória)
      description: >-
        Busca por nome (mínimo 3 caracteres) entre os participantes elegíveis
        para registro de presença na sessão, devolvendo no máximo 20 resultados.
        Exige a finalidade declarada (`finalidade`), registrada na auditoria.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/SessaoId'
        - name: busca
          in: query
          required: true
          description: Termo de busca pelo nome (mínimo 3 caracteres).
          schema: { type: string, minLength: 3 }
        - $ref: '#/components/parameters/FinalidadeLeitura'
      responses:
        '200':
          description: Candidatos elegíveis (no máximo 20 resultados)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    maxItems: 20
                    items: { $ref: '#/components/schemas/CandidatoPresenca' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /sessions/{id}/contingency-attendance:
    post:
      tags: [sessions]
      summary: Lançar presença de lista em papel
      description: >-
        Registro contingencial de presença em papel, com motivo obrigatório.
        Escrita idempotente (`Idempotency-Key`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/SessaoId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresencaContingenciaInput' }
      responses:
        '201':
          description: Presença contingencial registrada
          content:
            application/json:
              schema:
                type: object
                required: [presenca]
                properties:
                  presenca: { $ref: '#/components/schemas/Presenca' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /sessions/{id}/contingency-attendance/batch:
    post:
      tags: [sessions]
      summary: Lançar a lista em papel de uma vez (CA6, CA7)
      description: >-
        Até 100 participantes distintos com um único motivo. Cada linha roda como
        a contingência individual, na própria transação, e falha sozinha
        (`inelegivel`, `not_found` para inexistente ou mesclado,
        `sessao_em_estado_invalido` se a sessão mudar no meio). Sessão não
        `encerrada` responde 409 e não grava nada. Exige `sessao.gerenciar`.
        Escrita idempotente (`Idempotency-Key`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/SessaoId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresencaContingenciaLoteInput' }
      responses:
        '200':
          description: Resultado por linha e resumo
          content:
            application/json:
              schema:
                type: object
                required: [data, resumo]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ResultadoContingenciaLote' }
                  resumo:
                    type: object
                    required: [criadas, ja_existiam, erros]
                    properties:
                      criadas: { type: integer }
                      ja_existiam: { type: integer }
                      erros: { type: integer }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /attendance/{id}/reversal:
    post:
      tags: [sessions]
      summary: Estornar presença
      description: >-
        Estorna uma presença válida, com motivo obrigatório; a presença passa a
        `estornada` e o motivo é registrado. Escrita idempotente
        (`Idempotency-Key`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/PresencaId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
