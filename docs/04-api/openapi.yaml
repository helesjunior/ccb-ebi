        hora_inicio: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        hora_fim: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        inicio_vigencia: { type: string, format: date }
        fim_vigencia: { type: [string, 'null'], format: date }
    AgendaExcecao:
      type: object
      properties:
