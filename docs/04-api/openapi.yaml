        coordenadora_nome: { type: string }
        coordenadora_sem_vinculo: { type: boolean }
        membros:
          type: array
          items: { $ref: '#/components/schemas/MembroDaEquipe' }
    EquipeResumo:
      type: object
      properties:
        id: { type: string }
        ebi_id: { type: string }
        coordenadora_id: { type: string }
        coordenadora_nome: { type: string }
        coordenadora_sem_vinculo: { type: boolean }
        quantidade_membros: { type: integer }
    MembroDaEquipe:
      type: object
      properties:
        usuario_id: { type: string }
        nome: { type: string }
        sem_vinculo: { type: boolean }
    EquipeCriacaoInput:
      type: object
      required: [coordenadora_id]
      properties:
        coordenadora_id: { type: string }
    EquipeMembroInput:
      type: object
      required: [usuario_id]
      properties:
        usuario_id: { type: string }

    EscalaCriacaoInput:
      type: object
      required: [equipe_id, estimativa_participantes]
      properties:
        equipe_id:
          type: string
          description: >-
            Equipe da coordenadora que monta a escala (obrigatório). A dona da
            equipe vira dona da escala. A coordenadora só usa a própria equipe;
            chefe e `adm_igreja` usam a de qualquer coordenadora vigente do EBI.
        estimativa_participantes: { type: integer, minimum: 0, maximum: 65535 }
        membros:
          type: array
          items: { $ref: '#/components/schemas/EscalaMembroInput' }
    EscalaEstimativaInput:
      type: object
      required: [estimativa_participantes]
      properties:
        estimativa_participantes: { type: integer, minimum: 0, maximum: 65535 }
    EscalaMembroInput:
      type: object
      required: [usuario_id, funcao]
      properties:
        usuario_id: { type: string }
        funcao: { type: string, enum: [coordenadora, auxiliar] }
    EscalaFuncaoInput:
      type: object
      required: [funcao]
      properties:
        funcao: { type: string, enum: [coordenadora, auxiliar] }
    EscalaEnvelope:
      type: object
      properties:
        escala: { $ref: '#/components/schemas/Escala' }
    PresencaEquipeInput:
      type: object
      required: [membros]
      properties:
        membros:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, presente]
            properties:
              id: { type: string, description: Id da vaga (`EscalaMembro`). }
              presente: { type: boolean }
    EscalaResumo:
      type: object
      properties:
        sessao_id: { type: string }
        inicio_previsto: { type: string, format: date-time }
        fim_previsto: { type: string, format: date-time }
        sessao_status: { type: string }
        escala_id: { type: [string, 'null'] }
        situacao:
          type: string
          enum: [sem_escala, cancelada, abaixo_do_minimo, aguardando_aprovacao, aprovada]
        confirmados: { type: integer }
        membros: { type: integer }
    Escala:
      type: object
      properties:
        id: { type: string }
        sessao_id: { type: string }
        ebi_id: { type: string }
        igreja_id: { type: string }
        status: { type: string, enum: [prevista, aprovada] }
        situacao:
          type: string
          enum: [cancelada, abaixo_do_minimo, aguardando_aprovacao, aprovada]
        estimativa_participantes: { type: integer }
        participantes_por_auxiliar: { type: integer }
        aprovado_por: { type: [string, 'null'] }
        aprovado_em: { type: [string, 'null'], format: date-time }
        sessao:
          type: object
          properties:
            inicio_previsto: { type: string, format: date-time }
            fim_previsto: { type: string, format: date-time }
            status: { type: string }
        equipe_minima: { type: object, description: Calculo da equipe minima (ver CalculadoraEquipeMinima). }
        membros:
          type: array
          items: { $ref: '#/components/schemas/EscalaMembro' }
        presenca_equipe_pendente: { type: boolean }
        equipe:
          type: object
          properties:
            id: { type: string }
            coordenadora_id: { type: string }
            coordenadora_nome: { type: string }
        pode_gerir:
          type: boolean
          description: Dona da escala (atuando como coordenadora) ou supervisão (`coordenadora_chefe`, `adm_igreja`).
        pode_escolher_oferta:
          type: boolean
          description: Só a dona escolhe a oferta de uma vaga; a chefia apenas acompanha.
        vagas:
          type: array
          description: >-
            Vagas da escala. A dona e a supervisão recebem os nomes das
            ofertas; os demais, a contagem e quem foi escolhido.
          items: { $ref: '#/components/schemas/VagaEscala' }
    VagaEscalaEnvelope:
      type: object
      properties:
        data: { $ref: '#/components/schemas/VagaEscala' }
    VagaEscala:
      type: object
      description: >-
        Cartao da vaga. Os campos alem do nucleo dependem da projecao do leitor:
        `minha_oferta` e `conflitos` sempre; `ofertas_pendentes` e
        `motivo_encerramento` para quem tem `escala.ler`; `escolhido_nome` e
        `ofertas` para quem gere a escala.
      properties:
        id: { type: string }
        escala_id: { type: string }
        sessao:
          type: [object, 'null']
          properties:
            id: { type: string }
            inicio_previsto: { type: string, format: date-time }
            fim_previsto: { type: string, format: date-time }
        ebi_id: { type: string }
        ebi_nome: { type: string }
        dona_nome:
          type: string
          description: 'Vazio na projecao publica (a pessoa nao ve nomes alheios).'
        observacao: { type: [string, 'null'] }
        tipo: { type: string, enum: [acrescimo, substituicao] }
        status: { type: string, enum: [aberta, preenchida, cancelada] }
        expirada:
          type: boolean
          description: Vaga aberta cuja sessao nao esta mais `prevista`/`aberta`.
        minha_oferta:
          type: [object, 'null']
          properties:
            id: { type: string }
            status: { type: string, enum: [pendente, aceita, descartada, retirada] }
        conflitos:
          type: array
          items: { $ref: '#/components/schemas/ConflitoEscala' }
        ofertas_pendentes: { type: integer }
        motivo_encerramento: { type: [string, 'null'] }
        escolhido_nome: { type: [string, 'null'] }
        substituido_nome:
          type: [string, 'null']
          description: So na projecao de leitura.
        ofertas:
          type: array
          description: So para quem gere a escala.
          items:
            type: object
            properties:
              id: { type: string }
              usuario_id: { type: string }
              nome: { type: string }
              status: { type: string }
              conflitos:
                type: array
                items: { $ref: '#/components/schemas/ConflitoEscala' }
    EscalaMembro:
      type: object
      properties:
        id: { type: string }
        usuario_id: { type: string }
        nome: { type: string }
        funcao: { type: string, enum: [coordenadora, auxiliar] }
        status: { type: string, enum: [escalado, confirmado, troca_solicitada, substituido] }
        confirmado_em: { type: [string, 'null'], format: date-time }
        presente: { type: [boolean, 'null'] }
        substitui_membro_id: { type: [string, 'null'] }
        sem_vinculo: { type: boolean }
        conflitos:
          type: array
          description: >-
            CA-12: outras sessoes da pessoa que se sobrepoem a esta. So aviso,
            nunca bloqueia. O horario aparece para qualquer leitor; os nomes so
            para quem alcanca o outro EBI ou para a propria pessoa.
          items: { $ref: '#/components/schemas/ConflitoEscala' }
    ConflitoEscala:
      type: object
      properties:
        sessao_id: { type: [string, 'null'], description: 'Nulo quando o leitor não alcança o outro EBI.' }
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }
        igreja_nome: { type: [string, 'null'] }
        ebi_nome: { type: [string, 'null'] }
    EscalaConfirmacao:
      type: object
      properties:
        membro:
          type: object
          properties:
            id: { type: string }
            escala_id: { type: string }
            usuario_id: { type: string }
            funcao: { type: string, enum: [coordenadora, auxiliar] }
            status: { type: string, enum: [escalado, confirmado, troca_solicitada, substituido] }
            confirmado_em: { type: [string, 'null'], format: date-time }
            presente: { type: [boolean, 'null'] }
        conflitos:
          type: array
          description: CA-12, da propria pessoa.
          items: { $ref: '#/components/schemas/ConflitoEscala' }
    MinhaEscala:
      type: object
      properties:
        escala_id: { type: string }
        membro_id: { type: string }
        sessao_id: { type: string }
        inicio_previsto: { type: string, format: date-time }
        fim_previsto: { type: string, format: date-time }
        sessao_status: { type: string }
        escala_status: { type: string, enum: [prevista, aprovada, cancelada] }
        funcao: { type: string, enum: [coordenadora, auxiliar] }
        status: { type: string, enum: [escalado, confirmado, troca_solicitada] }
        presente: { type: [boolean, 'null'] }
        troca_id: { type: [string, 'null'], description: 'Troca pendente aberta pela propria pessoa; null nos demais casos.' }
        conflitos:
          type: array
          items: { $ref: '#/components/schemas/ConflitoEscala' }
    TrocaEscalaEnvelope:
      type: object
      properties:
        troca: { $ref: '#/components/schemas/TrocaEscala' }
    TrocaEscala:
      type: object
      properties:
        id: { type: string }
        escala_id: { type: string, description: 'So na listagem.' }
        sessao_id: { type: string, description: 'So na listagem.' }
        escala_membro_id: { type: string, description: 'Vaga original do pedido.' }
        membro_id: { type: string, description: 'So na listagem (mesmo valor de escala_membro_id).' }
        solicitante_id: { type: string }
        solicitante_nome: { type: string, description: 'So na listagem.' }
        motivo: { type: [string, 'null'] }
        status: { type: string, enum: [pendente, aprovada, recusada, cancelada] }
        situacao:
          type: string
          enum: [pendente, aprovada, recusada, cancelada, expirada]
        substituto_membro_id:
          type: [string, 'null']
          description: 'Vaga criada pela aprovacao.'
        decidido_por: { type: [string, 'null'] }
        decidido_em: { type: [string, 'null'], format: date-time }
        motivo_decisao: { type: [string, 'null'] }
        criado_em: { type: string, format: date-time }
    Sessao:
      type: object
      properties:
        id: { type: string }
        ebi_id: { type: string }
        ebi_nome: { type: string }
        timezone: { type: string, description: 'Fuso IANA da igreja; datas/horas da sessão são exibidas nele.' }
        igreja_id: { type: string }
        agenda_ebi_id: { type: [string, 'null'] }
        inicio_previsto: { type: string, format: date-time }
        fim_previsto: { type: string, format: date-time }
        inicio_real: { type: [string, 'null'], format: date-time }
        fim_real: { type: [string, 'null'], format: date-time }
        tema: { type: [string, 'null'] }
        passagem_biblica: { type: [string, 'null'] }
        status: { type: string, enum: [prevista, aberta, encerrada, cancelada] }
        realizada: { type: [boolean, 'null'] }
        motivo_cancelamento: { type: [string, 'null'] }
        auxiliares_escalados: { type: [integer, 'null'], minimum: 0 }
        presentes: { type: integer, minimum: 0 }
    EquipeMinima:
      type: object
      properties:
        presentes: { type: integer }
        participantes_por_auxiliar: { type: integer }
        auxiliares_necessarios: { type: integer }
        auxiliares_informados: { type: [integer, 'null'] }
        alerta: { type: boolean }
        origem:
          type: string
          enum: [escala, informado]
          description: >-
            `escala` quando há escala aprovada (conta auxiliares confirmados e
            vigentes na data); `informado` quando vem do campo antigo da sessão.
    SessaoDetalhe:
      allOf:
        - $ref: '#/components/schemas/Sessao'
        - type: object
          properties:
            equipe_minima: { $ref: '#/components/schemas/EquipeMinima' }
            escala_id:
              type: [string, 'null']
              description: >-
                Id da escala da sessão (de qualquer status), para a tela de
                presença buscar a equipe; `null` quando a sessão não tem escala.
    SessaoFechamentoInput:
      type: object
      required: [realizada]
      properties:
        realizada: { type: boolean }
        fim_real: { type: [string, 'null'], format: date-time }
    SessaoCancelamentoInput:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 3, maxLength: 255 }
    SessaoCorrecaoInput:
      type: object
      properties:
        tema: { type: [string, 'null'], maxLength: 255 }
        passagem_biblica: { type: [string, 'null'], maxLength: 255 }
        inicio_real: { type: [string, 'null'], format: date-time }
        fim_real: { type: [string, 'null'], format: date-time }
        realizada: { type: [boolean, 'null'] }
        auxiliares_escalados: { type: [integer, 'null'], minimum: 0 }
        motivo: { type: [string, 'null'], minLength: 3, maxLength: 255 }
    GeracaoSessoes:
      type: object
      properties:
        criadas: { type: integer }
        ignoradas: { type: integer }
        de: { type: string, format: date }
        ate: { type: string, format: date }
    CandidatoPresenca:
      type: object
      properties:
        id: { type: string }
        nome: { type: string }
        matricula: { type: string }
        igreja_referencia:
          oneOf:
            - type: object
              properties:
                id: { type: string }
                nome: { type: string }
            - type: 'null'
        elegivel: { type: boolean }
        motivo_bloqueio: { type: [string, 'null'] }
    Presenca:
      type: object
      properties:
        id: { type: string }
        sessao_id: { type: string }
        participante:
          type: object
          properties:
            id: { type: string }
            nome: { type: string }
            matricula: { type: string }
        registrado_por: { type: string }
        registrado_em: { type: string, format: date-time }
        origem: { type: string, enum: [web, app, contingencia] }
        status: { type: string, enum: [valida, estornada] }
        estornado_em: { type: [string, 'null'], format: date-time }
        motivo_estorno: { type: [string, 'null'] }
    PresencaRegistroInput:
      type: object
      required: [participante_id]
      properties:
        participante_id: { type: string }
        origem: { type: string, enum: [web, app], description: 'Padrão: web' }
    PresencaContingenciaLoteInput:
      type: object
      required: [participante_ids, motivo]
      properties:
        participante_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string }
        motivo: { type: string, minLength: 3, maxLength: 255 }
    ResultadoContingenciaLote:
      type: object
      required: [participante_id, resultado]
      properties:
        participante_id: { type: string }
        resultado: { type: string, enum: [criada, ja_existia, erro] }
        erro: { type: string, description: 'inelegivel | not_found (inexistente ou mesclado) | sessao_em_estado_invalido' }
        motivo_bloqueio: { type: [string, 'null'] }
        presenca: { $ref: '#/components/schemas/Presenca' }
    PresencaContingenciaInput:
      type: object
      required: [participante_id, motivo]
      properties:
        participante_id: { type: string }
        motivo: { type: string, minLength: 3, maxLength: 255 }
    EstornoInput:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 3, maxLength: 255 }
    HistoricoPresenca:
      type: object
      properties:
        id: { type: string }
        sessao_id: { type: string }
        ebi:
          type: object
          properties:
            id: { type: string }
            nome: { type: string }
            timezone: { type: string }
        inicio_previsto: { type: string, format: date-time }
        status: { type: string, enum: [valida, estornada] }
        registrado_em: { type: string, format: date-time }
