# Esqueleto inicial. Cresce junto com a implementação; ver convencoes.md e endpoints.md.
openapi: 3.1.0
info:
  title: EBI API
  version: 0.1.0
  description: API da Plataforma de Gestão do Espaço Bíblico Infantil (EBI). Proposta, sujeita à validação.
servers:
  - url: https://api.example.invalid/api/v1
    description: Placeholder; o domínio será definido pela infraestrutura da CCB.
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: identity
  - name: health
  - name: organization
  - name: team
  - name: participants
  - name: sessions
  - name: activities
  - name: privacy
paths:
  /health:
    get:
      tags: [health]
      summary: Estado dos serviços
      security: []
      responses:
        '200':
          description: Todos os serviços respondem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Alguma dependência está degradada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /auth/login:
    post:
      tags: [auth]
      summary: Autenticar
      description: >-
        Valida e-mail e senha. Perfis que exigem MFA (todo perfil ≠ Responsável)
        sempre recebem `mfa_required` + `token_desafio` (escopo restrito, sem
        sessão plena); a sessão só sai após `POST /auth/mfa/verify`. Quando o
        perfil ainda não tem fator inscrito, `mfa_inscricao_pendente` vem `true`
        e o mesmo `token_desafio` autoriza `POST /me/mfa/totp` e
        `POST /me/mfa/totp/confirm` para inscrever o TOTP antes de verificar.
        Responsável (perfil que não exige MFA) recebe a sessão direto.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Desafio de MFA emitido (perfil exige segundo fator)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '201':
          description: Sessão plena emitida (perfil que não exige MFA)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoEmitida' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/mfa/verify:
    post:
      tags: [auth]
      summary: Validar o segundo fator
      description: >-
        Autenticado pelo token de desafio (`mfa:pendente`). Valida o código TOTP
        ou um código de recuperação, revoga o desafio e emite a sessão plena.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo]
              properties:
                codigo: { type: string }
      responses:
        '201':
          description: Sessão plena emitida (token de dispositivo)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoEmitida' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/register-guardian:
    post:
      tags: [auth]
      summary: Criar conta de responsável
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistroGuardiao' }
      responses:
        '201': { description: Conta criada e verificação enviada por e-mail }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/verify-email:
    post:
      tags: [auth]
      summary: Verificar e-mail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario, signature]
              properties:
                usuario: { type: string }
                signature: { type: string }
      responses:
        '200': { description: E-mail verificado }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/email/resend:
    post:
      tags: [auth]
      summary: Reenviar verificação de e-mail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Pedido aceito (resposta idêntica exista ou não o e-mail) }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/password/forgot:
    post:
      tags: [auth]
      summary: Pedir recuperação de senha
      description: Sem enumeração de contas; a resposta é idêntica exista ou não o e-mail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Pedido aceito }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/password/reset:
    post:
      tags: [auth]
      summary: Redefinir senha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password]
              properties:
                email: { type: string, format: email }
                token: { type: string }
                password: { type: string, format: password, minLength: 12 }
      responses:
        '200': { description: Senha redefinida; sessões anteriores revogadas }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Encerrar a sessão atual
      responses:
        '204': { description: Sessão encerrada }
        '401': { $ref: '#/components/responses/Problem' }
  /me:
    get:
      tags: [identity]
      summary: Usuário autenticado
      responses:
        '200':
          description: Usuário autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/Problem' }
  /me/scopes:
    get:
      tags: [identity]
      summary: Contextos de atuação disponíveis
      description: Vínculos vigentes do usuário, para o seletor de contexto (`X-Acting-Scope`).
      parameters:
        - $ref: '#/components/parameters/XActingScope'
      responses:
        '200':
          description: Lista de contextos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ContextoAtuacao' }
        '401': { $ref: '#/components/responses/Problem' }
  /me/mfa/totp:
    post:
      tags: [identity]
      summary: Iniciar inscrição do TOTP
      responses:
        '200':
          description: Segredo e URI otpauth para o app autenticador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InscricaoTotp' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /me/mfa/totp/confirm:
    post:
      tags: [identity]
      summary: Confirmar inscrição do TOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo]
              properties:
                codigo: { type: string }
      responses:
        '200': { description: Fator validado; códigos de recuperação gerados }
        '422': { $ref: '#/components/responses/Problem' }
  /me/mfa/recovery-codes:
    post:
      tags: [identity]
      summary: Gerar códigos de recuperação
      responses:
        '200':
          description: Novos códigos de recuperação (mostrados uma única vez)
          content:
            application/json:
              schema:
                type: object
                properties:
                  codigos:
                    type: array
                    items: { type: string }
  /me/sessions:
    get:
      tags: [identity]
      summary: Listar dispositivos/sessões
      responses:
        '200':
          description: Sessões vigentes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SessaoLogin' }
        '401': { $ref: '#/components/responses/Problem' }
  /me/sessions/{id}:
    delete:
      tags: [identity]
      summary: Revogar dispositivo
      parameters:
        - $ref: '#/components/parameters/SessaoId'
      responses:
        '204': { description: Sessão revogada }
        '401': { $ref: '#/components/responses/Problem' }
  /users:
    get:
      tags: [team]
      summary: Listar usuários da equipe
      description: Restrito ao escopo de atuação (subárvore do vínculo).
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { type: string, enum: [ativo, suspenso] }
      responses:
        '200':
          description: Página de usuários
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /users/{id}:
    get:
      tags: [team]
      summary: Ver usuário
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '200':
          description: Usuário
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [team]
      summary: Atualizar usuário (nome, status)
      description: Suspender revoga as sessões do usuário e é auditado (RN-10).
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string, maxLength: 255 }
                status: { type: string, enum: [ativo, suspenso] }
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /invitations:
    get:
      tags: [team]
      summary: Listar convites
      responses:
        '200':
          description: Convites dentro do escopo de atuação
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Convite' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [team]
      summary: Convidar pessoa para a equipe
      description: O convidante só convida para papel/escopo dentro da sua autoridade.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConviteInput' }
      responses:
        '201':
          description: Convite criado e e-mail enviado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Convite' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /invitations/{id}:
    delete:
      tags: [team]
      summary: Cancelar convite
      parameters:
        - $ref: '#/components/parameters/ConviteId'
      responses:
        '204': { description: Convite cancelado }
        '403': { $ref: '#/components/responses/Problem' }
  /invitations/{id}/accept:
    post:
      tags: [auth]
      summary: Aceitar convite (público)
      description: >-
        O token secreto do convite é a credencial. Cria a conta já vinculada e
        marca o convite como aceito (uso único). Replay ou token inválido: 410.
      security: []
      parameters:
        - $ref: '#/components/parameters/ConviteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, nome, password]
              properties:
                token: { type: string }
                nome: { type: string, maxLength: 255 }
                password: { type: string, format: password, minLength: 12 }
      responses:
        '201':
          description: Conta criada e vinculada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContaCriada' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /access-grants:
    post:
      tags: [team]
      summary: Conceder vínculo de acesso
      description: Encerra o vínculo vigente do mesmo par e abre um novo (histórico por vigência); auditado. Exige autoridade sobre o papel e o escopo-alvo.
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VinculoInput' }
      responses:
        '201':
          description: Vínculo concedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vinculo' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /access-grants/{id}:
    delete:
      tags: [team]
      summary: Revogar vínculo de acesso
      parameters:
        - $ref: '#/components/parameters/VinculoId'
      responses:
        '204': { description: Vínculo revogado }
        '403': { $ref: '#/components/responses/Problem' }
  /sessions/{sessionId}/attendance:
    post:
      tags: [sessions]
      summary: Registrar presença
      description: Idempotente. Aplica a regra de elegibilidade etária (RN-13 a RN-16).
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantId]
              properties:
                participantId: { type: string }
                origin: { type: string, enum: [web, app] }
      responses:
        '201':
          description: Presença registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attendance' }
        '200': { description: Presença já existente (mesma chave ou mesmo participante e sessão) }
        '403': { $ref: '#/components/responses/Problem' }
        '422':
          description: 'Participante inelegível pela idade, ou sessão não aberta'
  /churches:
    get:
      tags: [organization]
      summary: Listar igrejas (paginado por cursor)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: codigo
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [ativo, inativo] }
      responses:
        '200':
          description: Página de igrejas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChurchPage' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [organization]
      summary: Criar igreja
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChurchInput' }
      responses:
        '201':
          description: Igreja criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Church' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /churches/{id}:
    get:
      tags: [organization]
      summary: Ver igreja
      parameters:
        - $ref: '#/components/parameters/IgrejaId'
      responses:
        '200':
          description: Igreja
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Church' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [organization]
      summary: Atualizar igreja
      parameters:
        - $ref: '#/components/parameters/IgrejaId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChurchInput' }
      responses:
        '200':
          description: Igreja atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Church' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /churches/{id}/transfers:
    post:
      tags: [organization]
      summary: Transferir igreja de setor
      description: Fecha o vínculo vigente e abre um novo. Sem data de corte; o setor vigente é sempre o atual.
      parameters:
        - $ref: '#/components/parameters/IgrejaId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sector_id, date]
              properties:
                sector_id: { type: string }
                date: { type: string, format: date }
                reason: { type: string }
      responses:
        '201':
          description: Igreja transferida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Church' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /regions:
    get:
      tags: [organization]
      summary: Listar regionais
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Página de regionais }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [organization]
      summary: Criar regional
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegionInput' }
      responses:
        '201':
          description: Regional criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Region' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /regions/{id}:
    patch:
      tags: [organization]
      summary: Atualizar regional
      parameters:
        - $ref: '#/components/parameters/RegionalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegionInput' }
      responses:
        '200':
          description: Regional atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Region' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /regions/{id}/sectors:
    get:
      tags: [organization]
      summary: Setores de uma regional
      parameters:
        - $ref: '#/components/parameters/RegionalId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Página de setores }
        '401': { $ref: '#/components/responses/Problem' }
  /sectors:
    get:
      tags: [organization]
      summary: Listar setores
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Página de setores }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [organization]
      summary: Criar setor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SectorInput' }
      responses:
        '201':
          description: Setor criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sector' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /sectors/{id}:
    patch:
      tags: [organization]
      summary: Atualizar setor
      parameters:
        - $ref: '#/components/parameters/SetorId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SectorInput' }
      responses:
        '200':
          description: Setor atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sector' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /ebis:
    get:
      tags: [organization]
      summary: Listar EBIs
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Página de EBIs }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [organization]
      summary: Criar EBI
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EbiInput' }
      responses:
        '201':
          description: EBI criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ebi' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /ebis/{id}:
    patch:
      tags: [organization]
      summary: Atualizar EBI
      parameters:
        - $ref: '#/components/parameters/EbiId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EbiInput' }
      responses:
        '200':
          description: EBI atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ebi' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /central:
    get:
      tags: [organization]
      summary: Central Nacional
      responses:
        '200': { description: Central Nacional (ou null) }
        '401': { $ref: '#/components/responses/Problem' }
  /privacy/terms:
    get:
      tags: [privacy]
      summary: Termo de privacidade vigente por finalidade
      security:
        - bearerAuth: []
      parameters:
        - name: finalidade
          in: query
          required: true
          description: Código da finalidade do termo (ex.: `cadastro`, `notificacoes`).
          schema: { type: string, example: cadastro }
      responses:
        '200':
          description: Termo vigente da finalidade (lista vazia quando não houver)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TermoVersao' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /privacy/consents:
    get:
      tags: [privacy]
      summary: Manifestações de consentimento atuais do titular
      description: >-
        Lista, por finalidade, a manifestação mais recente do próprio usuário
        autenticado. Não expõe consentimentos de terceiros.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Manifestações atuais do titular
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ManifestacaoPrivacidade' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [privacy]
      summary: Registrar aceite ou recusa do próprio titular
      description: >-
        Registra uma manifestação do usuário autenticado com evidência (IP,
        user agent e hash do termo). O cadastro assistido (`participante_id`)
        ainda não é aceito nesta etapa.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentimentoInput' }
      responses:
        '201':
          description: Manifestação registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManifestacaoPrivacidade' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /privacy/consents/{id}:
    get:
      tags: [privacy]
      summary: Recuperar uma manifestação com a versão do termo (CA-16)
      description: >-
        Exige a operação `consentimento.ler` e respeita o escopo de atuação:
        operadores só enxergam manifestações de titulares na própria subárvore.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConsentimentoId'
      responses:
        '200':
          description: Manifestação com a versão e o hash do termo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManifestacaoPrivacidade' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
    XActingScope:
      name: X-Acting-Scope
      in: header
      required: false
      description: >-
        Contexto de atuação no formato `papel=<codigo>;escopo=<tipo>:<id>`
        (RN-11). Obrigatório quando o usuário acumula vínculos; o servidor
        revalida contra os vínculos vigentes (nunca é aceito sem revalidação).
      schema: { type: string, example: "papel=adm_setor;escopo=setor:01H..." }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IgrejaId:
      name: id
      in: path
      required: true
      schema: { type: string }
    RegionalId:
      name: id
      in: path
      required: true
      schema: { type: string }
    SetorId:
      name: id
      in: path
      required: true
      schema: { type: string }
    EbiId:
      name: id
      in: path
      required: true
      schema: { type: string }
    SessaoId:
      name: id
      in: path
      required: true
      schema: { type: string }
    UsuarioId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ConviteId:
      name: id
      in: path
      required: true
      schema: { type: string }
    VinculoId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ConsentimentoId:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Problem:
      description: Erro no formato RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
    Usuario:
      type: object
      properties:
        id: { type: string }
        nome: { type: string }
        email: { type: string, format: email }
        email_verificado: { type: boolean }
        status: { type: string, enum: [ativo, suspenso] }
        papeis:
          type: array
          items: { type: string }
    LoginResponse:
      type: object
      properties:
        mfa_required: { type: boolean }
        mfa_inscricao_pendente: { type: boolean }
        token: { type: [string, 'null'] }
        token_desafio: { type: [string, 'null'] }
        usuario: { $ref: '#/components/schemas/Usuario' }
    SessaoEmitida:
      type: object
      properties:
        token: { type: string }
        usuario: { $ref: '#/components/schemas/Usuario' }
    ContextoAtuacao:
      type: object
      properties:
        papel: { type: string }
        tipo_escopo: { type: string, enum: [central, regional, setor, igreja, ebi] }
        escopo_id: { type: string }
    SessaoLogin:
      type: object
      properties:
        id: { type: string }
        dispositivo: { type: string }
        criada_em: { type: string, format: date-time }
        expira_em: { type: string, format: date-time }
    InscricaoTotp:
      type: object
      properties:
        segredo: { type: string }
        uri: { type: string }
    RegistroGuardiao:
      type: object
      required: [nome, email, password]
      properties:
        nome: { type: string, maxLength: 255 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 12 }
    Convite:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        papel: { type: string }
        tipo_escopo: { type: string, enum: [central, regional, setor, igreja, ebi] }
        escopo_id: { type: string }
        expira_em: { type: string, format: date-time }
        pendente: { type: boolean }
    ConviteInput:
      type: object
      required: [email, papel, tipo_escopo, escopo_id]
      properties:
        email: { type: string, format: email }
        papel: { type: string }
        tipo_escopo: { type: string, enum: [central, regional, setor, igreja, ebi] }
        escopo_id: { type: string }
    ContaCriada:
      type: object
      properties:
        id: { type: string }
        email_normalizado: { type: string, format: email }
        nome: { type: string }
    Vinculo:
      type: object
      properties:
        id: { type: string }
        usuario_id: { type: string }
        tipo_escopo: { type: string, enum: [central, regional, setor, igreja, ebi] }
        escopo_id: { type: string }
    VinculoInput:
      type: object
      required: [usuario_id, papel, tipo_escopo, escopo_id]
      properties:
        usuario_id: { type: string }
        papel: { type: string }
        tipo_escopo: { type: string, enum: [central, regional, setor, igreja, ebi] }
        escopo_id: { type: string }
    UsuarioPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Usuario' }
        meta:
          type: object
          properties:
            proximo_cursor: { type: [string, 'null'] }
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          properties:
            database: { type: string, enum: [ok, fail] }
            redis: { type: string, enum: [ok, fail] }
    Attendance:
      type: object
      properties:
        id: { type: string }
        sessionId: { type: string }
        participantId: { type: string }
        status: { type: string, enum: [valid, reversed] }
        origin: { type: string, enum: [web, app] }
        recordedAt: { type: string, format: date-time }
    Church:
      type: object
      properties:
        id: { type: string }
        codigo: { type: string }
        nome: { type: string }
        endereco: { type: [string, 'null'] }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        timezone: { type: string }
        status: { type: string, enum: [ativo, inativo] }
        setor:
          oneOf:
            - $ref: '#/components/schemas/Sector'
            - type: 'null'
    ChurchInput:
      type: object
      required: [codigo, nome]
      properties:
        codigo: { type: string }
        nome: { type: string }
        endereco: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        timezone: { type: string }
        status: { type: string, enum: [ativo, inativo] }
    ChurchPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Church' }
        meta:
          type: object
          properties:
            proximo_cursor: { type: [string, 'null'] }
    Region:
      type: object
      properties:
        id: { type: string }
        codigo: { type: string }
        nome: { type: string }
        central_nacional_id: { type: string }
        status: { type: string, enum: [ativo, inativo] }
    RegionInput:
      type: object
      required: [codigo, nome]
      properties:
        codigo: { type: string }
        nome: { type: string }
        central_nacional_id: { type: string }
        status: { type: string, enum: [ativo, inativo] }
    Sector:
      type: object
      properties:
        id: { type: string }
        codigo: { type: string }
        nome: { type: string }
        regional_id: { type: string }
        status: { type: string, enum: [ativo, inativo] }
    SectorInput:
      type: object
      required: [codigo, nome, regional_id]
      properties:
        codigo: { type: string }
        nome: { type: string }
        regional_id: { type: string }
        status: { type: string, enum: [ativo, inativo] }
    Ebi:
      type: object
      properties:
        id: { type: string }
        nome: { type: string }
        igreja_id: { type: string }
        participantes_por_auxiliar: { type: integer }
        status: { type: string, enum: [ativo, inativo] }
    EbiInput:
      type: object
      required: [nome, igreja_id]
      properties:
        nome: { type: string }
        igreja_id: { type: string }
        participantes_por_auxiliar: { type: integer }
        status: { type: string, enum: [ativo, inativo] }
    TermoVersao:
      type: object
      properties:
        id: { type: string }
        finalidade: { type: string }
        base_legal: { type: string }
        versao: { type: string }
        vigente_em: { type: string, format: date-time }
    ConsentimentoInput:
      type: object
      required: [termo_versao_id, decisao]
      properties:
        termo_versao_id: { type: string }
        decisao: { type: string, enum: [aceito, recusado] }
        retirar: { type: boolean, default: false }
    ManifestacaoPrivacidade:
      type: object
      required: [id, termo_versao_id, decisao, origem, evidencia, ocorrido_em]
      properties:
        id: { type: string }
        usuario_id: { type: [string, 'null'] }
        participante_id: { type: [string, 'null'] }
        termo_versao_id: { type: string }
        decisao: { type: string, enum: [aceito, recusado, retirado] }
        origem: { type: string, enum: [proprio, assistido] }
        evidencia: { type: string }
        ocorrido_em: { type: string, format: date-time }
        termo_versao:
          type: object
          properties:
            id: { type: string }
            finalidade: { type: string }
            base_legal: { type: string }
            versao: { type: string }
            texto_hash: { type: string }
            texto: { type: string }
