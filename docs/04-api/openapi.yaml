          type: array
          description: Papeis de equipe vigentes agrupados (coordenadora, coordenadora_chefe, auxiliar).
          items: { type: string }

    EscalaEquipeMembro:
      $ref: '#/components/schemas/EscalaMembro'

    Equipe:
      type: object
      properties:
        id: { type: string }
