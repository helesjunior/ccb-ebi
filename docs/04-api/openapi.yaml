# Esqueleto inicial. Cresce junto com a implementação; ver convencoes.md e endpoints.md.
openapi: 3.1.0
info:
  title: EBI API
  version: 0.1.0
  description: API da Plataforma de Gestão do Espaço Bíblico Infantil (EBI). Proposta, sujeita à validação.
servers:
  - url: https://api.example.invalid/api/v1
    description: Placeholder; o domínio será definido pela infraestrutura da CCB.
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: identity
  - name: health
  - name: organization
  - name: team
  - name: participants
  - name: sessions
  - name: escalas
  - name: activities
  - name: privacy
  - name: audit
paths:
  /health:
    get:
      tags: [health]
      summary: Estado dos serviços
      security: []
      responses:
        '200':
          description: Todos os serviços respondem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Alguma dependência está degradada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /auth/login:
    post:
      tags: [auth]
      summary: Autenticar
      description: >-
        Valida e-mail e senha. Perfis que exigem MFA (todo perfil ≠ Responsável)
        sempre recebem `mfa_required` + `token_desafio` (escopo restrito, sem
        sessão plena); a sessão só sai após `POST /auth/mfa/verify`. Quando o
        perfil ainda não tem fator inscrito, `mfa_inscricao_pendente` vem `true`
        e o mesmo `token_desafio` autoriza `POST /me/mfa/totp` e
        `POST /me/mfa/totp/confirm` para inscrever o TOTP antes de verificar.
        Responsável (perfil que não exige MFA) recebe a sessão direto.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Desafio de MFA emitido (perfil exige segundo fator)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '201':
          description: Sessão plena emitida (perfil que não exige MFA)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoEmitida' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/mfa/verify:
    post:
      tags: [auth]
      summary: Validar o segundo fator
      description: >-
        Autenticado pelo token de desafio (`mfa:pendente`). Valida o código TOTP
        ou um código de recuperação, revoga o desafio e emite a sessão plena.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo]
              properties:
                codigo: { type: string }
      responses:
        '201':
          description: Sessão plena emitida (token de dispositivo)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoEmitida' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/register-guardian:
    post:
      tags: [auth]
      summary: Criar conta de responsável
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistroGuardiao' }
      responses:
        '201': { description: Conta criada e verificação enviada por e-mail }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/verify-email:
    post:
      tags: [auth]
      summary: Verificar e-mail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario, signature]
              properties:
                usuario: { type: string }
                signature: { type: string }
      responses:
        '200': { description: E-mail verificado }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/email/resend:
    post:
      tags: [auth]
      summary: Reenviar verificação de e-mail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Pedido aceito (resposta idêntica exista ou não o e-mail) }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/password/forgot:
    post:
      tags: [auth]
      summary: Pedir recuperação de senha
      description: Sem enumeração de contas; a resposta é idêntica exista ou não o e-mail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Pedido aceito }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/password/reset:
    post:
      tags: [auth]
      summary: Redefinir senha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password]
              properties:
                email: { type: string, format: email }
                token: { type: string }
                password: { type: string, format: password, minLength: 12 }
      responses:
        '200': { description: Senha redefinida; sessões anteriores revogadas }
        '422': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Encerrar a sessão atual
      responses:
        '204': { description: Sessão encerrada }
        '401': { $ref: '#/components/responses/Problem' }
  /me:
    get:
      tags: [identity]
      summary: Usuário autenticado
      responses:
        '200':
          description: Usuário autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [identity]
      summary: Atualizar meu perfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string, maxLength: 255 }
                email: { type: string, format: email }
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /me/password:
    post:
      tags: [identity]
      summary: Trocar minha senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senha_atual, nova_senha, nova_senha_confirmation]
              properties:
                senha_atual: { type: string, format: password }
                nova_senha: { type: string, format: password, minLength: 12 }
                nova_senha_confirmation: { type: string, format: password, minLength: 12 }
      responses:
        '204': { description: Senha alterada; demais sessões revogadas }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /me/scopes:
    get:
      tags: [identity]
      summary: Contextos de atuação disponíveis
      description: Vínculos vigentes do usuário, para o seletor de contexto (`X-Acting-Scope`).
      parameters:
        - $ref: '#/components/parameters/XActingScope'
      responses:
        '200':
          description: Lista de contextos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ContextoAtuacao' }
        '401': { $ref: '#/components/responses/Problem' }
  /me/mfa/totp:
    post:
      tags: [identity]
      summary: Iniciar inscrição do TOTP
      responses:
        '200':
          description: Segredo e URI otpauth para o app autenticador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InscricaoTotp' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /me/mfa/totp/confirm:
    post:
      tags: [identity]
      summary: Confirmar inscrição do TOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo]
              properties:
                codigo: { type: string }
      responses:
        '200': { description: Fator validado; códigos de recuperação gerados }
        '422': { $ref: '#/components/responses/Problem' }
  /me/mfa/recovery-codes:
    post:
      tags: [identity]
      summary: Gerar códigos de recuperação
      responses:
        '200':
          description: Novos códigos de recuperação (mostrados uma única vez)
          content:
            application/json:
              schema:
                type: object
                properties:
                  codigos:
                    type: array
                    items: { type: string }
  /me/sessions:
    get:
      tags: [identity]
      summary: Listar dispositivos/sessões
      responses:
        '200':
          description: Sessões vigentes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SessaoLogin' }
        '401': { $ref: '#/components/responses/Problem' }
  /me/sessions/{id}:
    delete:
      tags: [identity]
      summary: Revogar dispositivo
      parameters:
        - $ref: '#/components/parameters/SessaoId'
      responses:
        '204': { description: Sessão revogada }
        '401': { $ref: '#/components/responses/Problem' }
  /me/ebis:
    get:
      tags: [sessions]
      summary: EBIs que o usuário pode operar
      description: >-
        Vínculos vigentes do usuário em escopos do tipo `ebi`, para o seletor de
        EBI da área de sessões (RF-06).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
      responses:
        '200':
          description: EBIs disponíveis para o usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EbiResumo' }
        '401': { $ref: '#/components/responses/Problem' }
  /users:
    get:
      tags: [team]
      summary: Listar usuários da equipe
      description: Restrito ao escopo de atuação (subárvore do vínculo).
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { type: string, enum: [ativo, suspenso] }
      responses:
        '200':
          description: Página de usuários
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /users/{id}:
    get:
      tags: [team]
      summary: Ver usuário
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '200':
          description: Usuário
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [team]
      summary: Atualizar usuário (nome, status)
      description: Suspender revoga as sessões do usuário e é auditado (RN-10).
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string, maxLength: 255 }
                status: { type: string, enum: [ativo, suspenso] }
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /invitations:
    get:
      tags: [team]
      summary: Listar convites
      responses:
        '200':
          description: Convites dentro do escopo de atuação
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Convite' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [team]
      summary: Convidar pessoa para a equipe
      description: O convidante só convida para papel/escopo dentro da sua autoridade.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConviteInput' }
      responses:
        '201':
          description: Convite criado e e-mail enviado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Convite' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /invitations/{id}:
    delete:
      tags: [team]
      summary: Cancelar convite
      parameters:
        - $ref: '#/components/parameters/ConviteId'
      responses:
        '204': { description: Convite cancelado }
        '403': { $ref: '#/components/responses/Problem' }
  /invitations/{id}/accept:
    post:
      tags: [auth]
      summary: Aceitar convite (público)
      description: >-
        O token secreto do convite é a credencial. Cria a conta já vinculada e
        marca o convite como aceito (uso único). Replay ou token inválido: 410.
      security: []
      parameters:
        - $ref: '#/components/parameters/ConviteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, nome, password]
              properties:
                token: { type: string }
                nome: { type: string, maxLength: 255 }
                password: { type: string, format: password, minLength: 12 }
      responses:
        '201':
          description: Conta criada e vinculada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContaCriada' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /access-grants:
    post:
      tags: [team]
      summary: Conceder vínculo de acesso
      description: Encerra o vínculo vigente do mesmo par e abre um novo (histórico por vigência); auditado. Exige autoridade sobre o papel e o escopo-alvo.
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VinculoInput' }
      responses:
        '201':
          description: Vínculo concedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vinculo' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /access-grants/{id}:
    delete:
      tags: [team]
      summary: Revogar vínculo de acesso
      parameters:
        - $ref: '#/components/parameters/VinculoId'
      responses:
        '204': { description: Vínculo revogado }
        '403': { $ref: '#/components/responses/Problem' }
  /sessions/{id}/attendance:
    post:
      tags: [sessions]
      summary: Registrar presença
      description: Idempotente. Aplica a regra de elegibilidade etária (RN-13 a RN-16). `422` indica participante `inelegivel` (com `motivo_bloqueio` no corpo do erro) e `409` indica sessão não aberta.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/SessaoId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresencaRegistroInput' }
      responses:
        '201':
          description: Presença registrada
          content:
            application/json:
              schema:
                type: object
                required: [presenca]
                properties:
                  presenca: { $ref: '#/components/schemas/Presenca' }
                  aviso: { type: [string, 'null'] }
        '200':
          description: Presença já existente (mesma chave ou mesmo participante e sessão)
          content:
            application/json:
              schema:
                type: object
                required: [presenca]
                properties:
                  presenca: { $ref: '#/components/schemas/Presenca' }
                  aviso: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      tags: [sessions]
      summary: Presenças da sessão
      description: Exige a finalidade declarada (até 255 caracteres), registrada na auditoria como `presenca.lida`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XActingScope'
        - $ref: '#/components/parameters/SessaoId'
        - $ref: '#/components/parameters/FinalidadeLeitura'
      responses:
        '200':
          description: Presenças da sessão
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Presenca' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /churches:
    get:
      tags: [organization]
      summary: Listar igrejas (paginado por cursor)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: codigo
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [ativo, inativo] }
      responses:
        '200':
          description: Página de igrejas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChurchPage' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [organization]
      summary: Criar igreja
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChurchInput' }
      responses:
        '201':
          description: Igreja criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Church' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /churches/{id}:
    get:
      tags: [organization]
      summary: Ver igreja
      parameters:
        - $ref: '#/components/parameters/IgrejaId'
      responses:
        '200':
          description: Igreja
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Church' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [organization]
      summary: Atualizar igreja
      parameters:
        - $ref: '#/components/parameters/IgrejaId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChurchInput' }
      responses:
        '200':
          description: Igreja atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Church' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /churches/{id}/transfers:
    post:
      tags: [organization]
      summary: Transferir igreja de setor
      description: Fecha o vínculo vigente e abre um novo. Sem data de corte; o setor vigente é sempre o atual.
      parameters:
        - $ref: '#/components/parameters/IgrejaId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sector_id, date]
              properties:
                sector_id: { type: string }
                date: { type: string, format: date }
                reason: { type: string, maxLength: 255 }
      responses:
        '201':
          description: Igreja transferida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Church' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /regions:
    get:
      tags: [organization]
      summary: Listar regionais
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Página de regionais }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [organization]
      summary: Criar regional
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegionInput' }
      responses:
        '201':
          description: Regional criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Region' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /regions/{id}:
    patch:
      tags: [organization]
      summary: Atualizar regional
      parameters:
        - $ref: '#/components/parameters/RegionalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegionInput' }
      responses:
        '200':
          description: Regional atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Region' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /regions/{id}/sectors:
    get:
      tags: [organization]
      summary: Setores de uma regional
      parameters:
        - $ref: '#/components/parameters/RegionalId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Página de setores }
        '401': { $ref: '#/components/responses/Problem' }
  /sectors:
    get:
      tags: [organization]
      summary: Listar setores
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Página de setores }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [organization]
      summary: Criar setor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SectorInput' }
      responses:
        '201':
          description: Setor criado
          content:
            application/json:
