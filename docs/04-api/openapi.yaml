        content:
          application/json:
            schema: { $ref: '#/components/schemas/VinculoResponsavelInput' }
      responses:
        '201':
          description: Vínculo solicitado (pendente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponsavelParticipante' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
